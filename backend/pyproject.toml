[project]
name = "kf-agent-backend"
version = "0.1.0"
description = "客服 Agent 后端:FastAPI + Pydantic AI + LlamaIndex + Chroma"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-ai-slim[openai]",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-chroma>=0.4",
    "chromadb>=0.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "httpx>=0.28",
]

[tool.uv]
package = false

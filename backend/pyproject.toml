[project]
name = "kf-agent-backend"
version = "0.1.0"
description = "客服 Agent 后端:FastAPI + Pydantic AI + LlamaIndex + Chroma"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-ai-slim[openai]",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-chroma>=0.4",
    "chromadb>=0.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "openai>=1.60",
    "httpx>=0.28",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
]

[tool.uv]
package = false

# 可选组件:本地交叉编码器重排(默认用智谱 rerank API,无需安装)
[project.optional-dependencies]
rerank-local = ["fastembed>=0.6"]
